<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Next Player</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            --text-main: #FFFFFF;
            --text-sub: rgba(255, 255, 255, 0.75);
            --github-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --play-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0e15;
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .backdrop-container {
            position: fixed;
            inset: -30px;
            z-index: 0;
            pointer-events: none;
        }

        .banner-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.4) saturate(1.2);
            transform: scale(1.1);
        }

        .mesh-gradient {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 80% 10%, rgba(56, 239, 125, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 20% 90%, rgba(0, 198, 255, 0.25) 0%, transparent 40%);
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            padding: 24px;
            border-radius: 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .mini-poster {
            width: 70px;
            height: 105px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.2);
        }

        .mini-poster.hidden {
            display: none;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        p {
            font-size: 0.82rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-dl {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            color: #FFF;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            transition: all 0.25s ease;
        }

        .btn-github {
            background: var(--github-gradient);
            box-shadow: 0 6px 16px rgba(56, 239, 125, 0.3);
        }

        .btn-playstore {
            background: var(--play-gradient);
            box-shadow: 0 6px 16px rgba(0, 198, 255, 0.3);
        }

        .btn-dl:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-dl:active {
            transform: translateY(0);
        }

        .badge {
            position: absolute;
            top: -8px;
            right: 12px;
            background: #FFF;
            color: #0d0e15;
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-dl svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .retry-btn {
            font-size: 0.78rem;
            color: var(--text-sub);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.4);
            padding-bottom: 1px;
            transition: color 0.2s;
        }

        .retry-btn:hover {
            color: #FFF;
            border-bottom-color: #FFF;
        }
    </style>
</head>
<body>

    <div class="backdrop-container">
        <div id="banner-bg" class="banner-backdrop"></div>
        <div class="mesh-gradient"></div>
    </div>

    <main class="card">
        <img id="poster-img" class="mini-poster hidden" src="" alt="Poster" />

        <h1>Installation Required</h1>
        
        <p>
            To stream <strong id="stream-name">this title</strong>, install <strong>Next Player</strong> via GitHub or Google Play.
        </p>

        <div class="btn-group">
            <a href="https://github.com/anilbeesetti/nextplayer/releases" class="btn-dl btn-github" target="_blank">
                <span class="badge">Recommended</span>
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub Release
            </a>

            <a href="https://play.google.com/store/apps/details?id=dev.anilbeesetti.nextplayer" class="btn-dl btn-playstore" target="_blank">
                <svg viewBox="0 0 24 24">
                    <path d="M3 20.5v-17c0-.83.67-1.5 1.5-1.5.34 0 .65.11.9.31l12.8 9.2a1.5 1.5 0 0 1 0 2.48l-12.8 9.2a1.5 1.5 0 0 1-.9.31c-.83 0-1.5-.67-1.5-1.5z"/>
                </svg>
                Google Play Store
            </a>
        </div>

        <a href="javascript:void(0)" class="retry-btn" onclick="tryLaunchAgain()">Installed app? Tap to play</a>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get('url');
        const mediaTitle = params.get('title') || "Video Stream";
        const posterUrl = params.get('poster');
        const bannerUrl = params.get('banner');

        if (mediaTitle) document.getElementById('stream-name').textContent = `"${mediaTitle}"`;

        // Poster load validation
        const posterImg = document.getElementById('poster-img');
        if (posterUrl) {
            posterImg.src = posterUrl;
            posterImg.onload = () => posterImg.classList.remove('hidden');
            posterImg.onerror = () => posterImg.classList.add('hidden');
        }

        // Banner load validation
        const bannerBg = document.getElementById('banner-bg');
        if (bannerUrl) {
            const img = new Image();
            img.src = bannerUrl;
            img.onload = () => { bannerBg.style.backgroundImage = `url('${bannerUrl}')`; };
            img.onerror = () => { bannerBg.style.backgroundImage = 'none'; };
        }

        function tryLaunchAgain() {
            if (!streamUrl) return;

            const rawStreamPath = streamUrl.replace(/^https?:\/\//, '');
            const scheme = streamUrl.startsWith('https') ? 'https' : 'http';

            const intentUrl = `intent://${rawStreamPath}#Intent;` +
                `scheme=${scheme};` +
                `action=android.intent.action.VIEW;` +
                `package=dev.anilbeesetti.nextplayer;` +
                `component=dev.anilbeesetti.nextplayer/.feature.player.PlayerActivity;` +
                `S.title=${encodeURIComponent(mediaTitle)};` +
                `end`;

            window.location.href = intentUrl;
        }

        window.onload = () => { tryLaunchAgain(); };
    </script>
</body>
</html>
