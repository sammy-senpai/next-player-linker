<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Link Generator - Next Player</title>
    <style>
        :root {
            --accent-gradient: linear-gradient(135deg, #FF3366 0%, #FF6B3B 50%, #FF8E53 100%);
            --card-bg: rgba(22, 25, 37, 0.88);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --input-bg: rgba(0, 0, 0, 0.4);
            --text-main: #FFFFFF;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }

        html, body {
            background-color: #0d0e15;
            min-height: 100dvh;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center; /* Centered vertically */
            padding: 24px 16px;
            position: relative;
        }

        .backdrop-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 51, 102, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(58, 134, 255, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(56, 239, 125, 0.12) 0%, transparent 50%);
        }

        /* margin: auto keeps it perfectly centered when tall, but safe when scrolling */
        .card {
            position: relative;
            z-index: 2;
            max-width: 680px;
            width: 100%;
            margin: auto;
            padding: 28px;
            border-radius: 28px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 14px;
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .full-width {
            grid-column: span 2;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label .required-star {
            color: #FF3366;
            margin-left: 2px;
        }

        input, textarea {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.6);
        }

        textarea {
            resize: none;
            height: 60px;
        }

        .output-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        .output-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .output-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: #FF8E53;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .output-text {
            font-family: monospace;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.88);
            word-break: break-all;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-copy {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #FFF;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-copy.copied {
            background: #38ef7d;
            color: #000;
            border-color: #38ef7d;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #FFF;
            box-shadow: 0 6px 16px rgba(255, 51, 102, 0.3);
        }

        .btn-primary.disabled {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 51, 102, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #FFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        @media (max-width: 580px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="backdrop-container"></div>

    <main class="card">
        <div class="header">
            <h1>Link Generator</h1>
            <span class="badge">Next Player</span>
        </div>

        <form class="form-grid" onsubmit="return false;">
            <div class="field-group full-width">
                <label for="streamUrl">Stream URL (.m3u8 / .mp4)<span class="required-star">*</span></label>
                <input type="url" id="streamUrl" value="" placeholder="https://domain.com/video.m3u8" required />
            </div>

            <div class="field-group full-width">
                <label for="title">Title<span class="required-star">*</span></label>
                <input type="text" id="title" value="" placeholder="Movie or Episode Title" required />
            </div>

            <div class="field-group">
                <label for="poster">Poster Image URL (Optional)</label>
                <input type="url" id="poster" value="" placeholder="https://..." />
            </div>

            <div class="field-group">
                <label for="banner">Banner Image URL (Optional)</label>
                <input type="url" id="banner" value="" placeholder="https://..." />
            </div>

            <div class="field-group full-width">
                <label for="desc">Description / Synopsis (Optional)</label>
                <textarea id="desc" placeholder="Short description of the stream..."></textarea>
            </div>
        </form>

        <div class="output-section">
            <div class="output-box">
                <div class="output-label">Web Landing Link (Shareable)</div>
                <div id="webLinkOutput" class="output-text">Enter Stream URL and Title above...</div>
                <button class="btn-copy" onclick="copyToClipboard('webLinkOutput', this)">Copy Link</button>
            </div>
        </div>

        <div class="actions">
            <a id="testWebLink" href="#" target="_blank" class="btn-primary disabled">Try Link</a>
            <button class="btn-secondary" onclick="resetForm()">Clear All</button>
        </div>
    </main>

    <script>
        const inputs = ['streamUrl', 'title', 'poster', 'banner', 'desc'];

        function generateLinks() {
            const baseUrl = "https://sameerdeshmukh37.github.io/next-player-linker/index.html";
            const streamUrl = document.getElementById('streamUrl').value.trim();
            const title = document.getElementById('title').value.trim();
            const poster = document.getElementById('poster').value.trim();
            const banner = document.getElementById('banner').value.trim();
            const desc = document.getElementById('desc').value.trim();

            const testBtn = document.getElementById('testWebLink');
            const outputText = document.getElementById('webLinkOutput');

            if (!streamUrl || !title) {
                outputText.textContent = "Enter Stream URL and Title above to generate link...";
                testBtn.href = "#";
                testBtn.classList.add('disabled');
                return;
            }

            const params = new URLSearchParams();
            params.set('url', streamUrl);
            params.set('title', title);
            if (poster) params.set('poster', poster);
            if (banner) params.set('banner', banner);
            if (desc) params.set('desc', desc);

            const fullWebLink = `${baseUrl}?${params.toString()}`;

            outputText.textContent = fullWebLink;
            testBtn.href = fullWebLink;
            testBtn.classList.remove('disabled');
        }

        function copyToClipboard(elementId, btn) {
            const text = document.getElementById(elementId).textContent;
            if (text.startsWith("Enter Stream URL")) return;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 1800);
            });
        }

        function resetForm() {
            document.getElementById('streamUrl').value = "";
            document.getElementById('title').value = "";
            document.getElementById('poster').value = "";
            document.getElementById('banner').value = "";
            document.getElementById('desc').value = "";
            generateLinks();
        }

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', generateLinks);
        });

        window.onload = generateLinks;
    </script>
</body>
</html>
